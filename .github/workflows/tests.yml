name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      # The tests build their own fake export, so no health data is needed here.
      - run: pip install -r requirements.txt -e .
      - run: pytest
