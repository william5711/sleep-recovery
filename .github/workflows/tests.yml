name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The tests build their own fake export, so no health data is needed here.
      - run: pip install -r requirements.txt -e .
      - run: pytest
